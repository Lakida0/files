<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="HTML5 Audio API showcase — an audio spectrum visualizer.">
<meta name="google" value="notranslate">
<link rel="shortcut icon" href="./favicon.ico">
<link rel="stylesheet" href="./assets/site.css">
<title>HTML5 音频频谱可视化</title>
<style>
  .viz-shell {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px 56px;
  }

  @media (max-width: 640px) {
    .viz-shell {
      padding: 20px 16px 40px;
    }
  }

  .viz-panel {
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: var(--shadow-md);
  }

  #info {
    min-height: 1.4em;
    margin-bottom: 12px;
    font-size: 14px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .drop-hint {
    margin-bottom: 10px;
    font-size: 13.5px;
    color: var(--text-dim);
  }

  .drop-hint code {
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--surface-2);
    font-family: var(--mono);
    font-size: 0.9em;
  }

  #uploadedFile {
    display: block;
    width: 100%;
    max-width: 100%;
    margin-top: 8px;
    padding: 9px 11px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
  }

  #uploadedFile::file-selector-button {
    margin-right: 12px;
    padding: 6px 13px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  #uploadedFile::file-selector-button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  #visualizer_wrapper {
    position: relative;   /* anchors the floating scale switch */
    margin-top: 16px;
    border-radius: var(--radius);
    background: #17150f;
    overflow: hidden;
  }

  #canvas {
    display: block;
    /* Both axes are set from JS to fixed pixel sizes so the drawing buffer can
       scale with devicePixelRatio without the element changing size. A CSS
       width here would fight those inline styles. */
    max-width: 100%;
  }

  /* Scale switch, floated over the top-right of the spectrum. */
  .viz-controls {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1;
    display: inline-flex;
    padding: 3px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
  }

  .viz-controls button {
    padding: 4px 11px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: rgba(255, 255, 255, 0.72);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .viz-controls button:hover {
    color: #fff;
  }

  .viz-controls button[aria-pressed="true"] {
    background: rgba(255, 255, 255, 0.92);
    color: #14120c;
  }

  .viz-tip {
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--text-faint);
  }
</style>
</head>

<body>

<div class="viz-shell">

  <a class="back-link" href="./">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    返回首页
  </a>

  <h1 class="page-title" style="margin-bottom:4px;"><span class="glyph">📊</span>HTML5 音频频谱可视化</h1>
  <p class="page-sub" style="margin-bottom:22px;">
    基于 HTML5 Audio API，纯前端解析音频并在 Canvas 上绘制实时频谱。
  </p>

  <div id="wrapper" class="viz-panel">
    <div id="fileWrapper" class="file_wrapper">
      <div id="info">HTML5 Audio API showcase | An Audio Visualizer</div>
      <p class="drop-hint">
        拖放音频文件到下方频谱区域，或在此选择文件（<code>mp3</code> / <code>flac</code> / <code>wav</code> / <code>ogg</code>）
      </p>
      <label for="uploadedFile" class="drop-hint" style="display:block;">Drag &amp; drop or select a file to play:</label>
      <input type="file" id="uploadedFile" accept="audio/*">
    </div>

    <div id="visualizer_wrapper">
      <div class="viz-controls" role="group" aria-label="频率刻度">
        <button type="button" data-scale="log" aria-pressed="true" title="对数刻度：更接近人耳听感">对数</button>
        <button type="button" data-scale="linear" aria-pressed="false" title="线性刻度：每根柱子覆盖相同带宽">线性</button>
      </div>
      <canvas id="canvas" width="800" height="350"></canvas>
    </div>

    <p class="viz-tip">全部处理都在你的浏览器本地完成，音频文件不会被上传到任何服务器。</p>
  </div>

  <footer class="site-foot">
    <span>核心可视化代码作者 Wayou · MIT License</span>
    <span class="foot-links">
      <a href="https://github.com/Wayou/HTML5_Audio_Visualizer" target="_blank" rel="noopener">原项目 GitHub</a>
    </span>
  </footer>

</div>

<script>
/*
 * An audio spectrum visualizer built with HTML5 Audio API
 * Author: Wayou
 * License: MIT
 * Feb 15, 2014
 */
window.onload = function() {
    new Visualizer().ini();
};
var Visualizer = function() {
    this.file = null, //the current file
    this.fileName = null, //the current file name
    this.audioContext = null,
    this.source = null, //the audio source
    this.info = document.getElementById('info').innerHTML, //this used to upgrade the UI information
    this.infoUpdateId = null, //to store the setTimeout ID and clear the interval
    this.animationId = null,
    this.status = 0, //flag for sound is playing 1 or stopped 0
    this.forceStop = false,
    this.allCapsReachBottom = false,
    this.capHeight = 2,
    this.capYPositionArray = [],
    this.cssWidth = 800,
    this.cssHeight = 350,
    this.resizeTimer = null,
    //Full audible range. Clamped to the context's Nyquist limit at build time.
    this.freqMin = 20,
    this.freqMax = 20000,
    //'log' (default) or 'linear'; switchable from the UI.
    this.freqScale = 'log',
    //Layout, in CSS pixels, scaled by devicePixelRatio when measuring.
    this.targetBarCss = 9,   //desired bar width; the count follows from this
    this.gapRatio = 0.16,    //gap as a fraction of the bar pitch
    //Height-to-width ratio, used as `height = width * aspectRatio`.
    this.aspectRatio = 350 / 800,
    this.meterWidth = 10,    //recomputed on every measure
    this.gap = 2,            //recomputed on every measure
    this.bands = null, //cached bin ranges, keyed by meter count
    this.bandsForMeterNum = 0,
    this.resizeObserver = null
};
Visualizer.prototype = {
    ini: function() {
        this._prepareAPI();
        this._resizeCanvas();
        this._addEventListner();

        var that = this;
        window.addEventListener('resize', function() {
            // Re-measure on a trailing edge so we do not thrash during a drag-resize.
            if (that.resizeTimer !== null) {
                clearTimeout(that.resizeTimer);
            }
            that.resizeTimer = setTimeout(function() {
                that._resizeCanvas();
            }, 150);
        }, false);

        //Also follow the container itself, which can change without a window
        //resize (scrollbar appearing, mobile browser chrome, zoom).
        this._observeResize();
    },
    _prepareAPI: function() {
        //fix browser vender for AudioContext and requestAnimationFrame
        window.AudioContext = window.AudioContext || window.webkitAudioContext || window.mozAudioContext || window.msAudioContext;
        window.requestAnimationFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || window.msRequestAnimationFrame;
        window.cancelAnimationFrame = window.cancelAnimationFrame || window.webkitCancelAnimationFrame || window.mozCancelAnimationFrame || window.msCancelAnimationFrame;
        try {
            this.audioContext = new AudioContext();
        } catch (e) {
            this._updateInfo('!Your browser does not support AudioContext', false);
            console.log(e);
        }
    },
    _resizeCanvas: function() {
        //Measure the container, not the canvas: the canvas is sized from this
        //value, so reading it back would keep a stale width alive forever.
        var canvas = document.getElementById('canvas');
        if (!canvas) {
            return;
        }
        var host = canvas.parentNode || canvas;
        var box = host.getBoundingClientRect();
        //Fall back to the canvas or the default if the host is not laid out.
        var availCss = Math.round(box.width || canvas.getBoundingClientRect().width || 800);
        var width = Math.max(240, availCss);
        var height = Math.round(width * this.aspectRatio);
        var dpr = Math.min(window.devicePixelRatio || 1, 2);

        this.cssWidth = width;
        this.cssHeight = height;
        //`canvas.width`/`height` are the BACKING STORE in device pixels, and they
        //also act as the element's intrinsic size. They must therefore be pinned
        //back to CSS pixels here, or the canvas displays at dpr times too large
        //(a 150% Windows display would render it 2.5x oversized).
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        //Lay the meters out so the row ends exactly on the right edge with no
        //blank strip. Each meter advances by (bar + gap), so for N meters to
        //fill the width the bar width is (cw / N) - gap: the final meter's
        //trailing gap falls on the edge and costs nothing.
        var cw = canvas.width;
        var gapPx = Math.max(1, Math.round(this.targetBarCss * this.gapRatio * dpr));
        var targetPitch = Math.max(gapPx + 2, this.targetBarCss * dpr);
        var meterNum = Math.max(8, Math.min(400, Math.round(cw / targetPitch)));

        this.meterNum = meterNum;
        this.gap = gapPx;
        this.meterWidth = Math.max(1, cw / meterNum - gapPx);
        //Peak-hold state is per meter, so it must be rebuilt on resize or the
        //two fall out of sync and the caps get drawn at the wrong heights.
        this.capYPositionArray = [];
        this.bands = null;
        this.bandsForMeterNum = 0;
        //The cached gradient is tied to the old drawing height.
        this._gradient = null;
        this._gradientHeight = 0;
    },
    //Watch the canvas container so layout changes that are not window resizes
    //(scrollbar appearing, mobile viewport chrome, parent flex changes) are
    //picked up too.
    _observeResize: function() {
        if (typeof ResizeObserver !== 'function') {
            return;
        }
        var canvas = document.getElementById('canvas');
        var host = canvas && (canvas.parentNode || canvas);
        if (!host) {
            return;
        }
        var that = this;
        this.resizeObserver = new ResizeObserver(function() {
            if (that.resizeTimer !== null) {
                clearTimeout(that.resizeTimer);
            }
            that.resizeTimer = setTimeout(function() {
                that._resizeCanvas();
            }, 100);
        });
        this.resizeObserver.observe(host);
    },
    //Map a frequency to an FFT bin index.
    _freqToBin: function(freq, sampleRate, binCount) {
        var bin = Math.round(freq / (sampleRate / 2) * binCount);
        return Math.min(binCount - 1, Math.max(0, bin));
    },
    //Build the bin range each meter covers for the active frequency scale.
    //Log spacing matches how we hear and puts most of the width where music
    //lives; linear spacing puts equal hertz in every meter, which is what a
    //technical analyser shows.
    _buildBands: function(analyser, meterNum) {
        var ctxRef = this.audioContext || analyser.context;
        var sampleRate = ctxRef ? ctxRef.sampleRate : 44100;
        var binCount = analyser.frequencyBinCount;
        var nyquist = sampleRate / 2;
        //Ask for 20 Hz - 20 kHz, but never above what this context can represent
        //(a 32 kHz context tops out at 16 kHz, an 8 kHz one at 4 kHz).
        var fMin = Math.max(1, Math.min(this.freqMin, nyquist));
        var fMax = Math.min(this.freqMax, nyquist);
        if (fMax <= fMin) fMax = nyquist;
        var isLog = this.freqScale !== 'linear';

        var bands = new Array(meterNum);
        var logMin = Math.log(fMin);
        var logSpan = Math.log(fMax) - logMin;
        var linSpan = fMax - fMin;
        var prevHi = 0;
        for (var i = 0; i < meterNum; i++) {
            var fLo, fHi;
            if (isLog) {
                fLo = Math.exp(logMin + logSpan * i / meterNum);
                fHi = Math.exp(logMin + logSpan * (i + 1) / meterNum);
            } else {
                fLo = fMin + linSpan * i / meterNum;
                fHi = fMin + linSpan * (i + 1) / meterNum;
            }
            //Every meter gets at least one bin, otherwise the highest meter
            //would wrap around and read the bass.
            var lo = this._freqToBin(fLo, sampleRate, binCount);
            var hi = this._freqToBin(fHi, sampleRate, binCount);
            if (hi <= lo) hi = Math.min(binCount - 1, lo + 1);
            //Rounding to bin boundaries can make a band a bin narrower than the
            //one below it, which shows up as a bar that never quite reaches its
            //neighbour. Keep the widths non-decreasing instead.
            if (hi < prevHi) hi = Math.min(binCount, prevHi);
            prevHi = hi;
            bands[i] = { lo: lo, hi: hi };
        }
        //Pin the ends so the display provably spans the whole window: rounding
        //to bin boundaries can otherwise leave the top band short of fMax,
        //wasting the rightmost few percent of the width.
        bands[0].lo = Math.min(bands[0].lo, this._freqToBin(fMin, sampleRate, binCount));
        bands[meterNum - 1].hi = Math.max(
            bands[meterNum - 1].hi, this._freqToBin(fMax, sampleRate, binCount));
        //The last band is exclusive, so make sure it can reach the final bin.
        bands[meterNum - 1].hi = Math.min(binCount, Math.max(bands[meterNum - 1].hi + 1,
                                                            bands[meterNum - 1].lo + 1));
        this.bands = bands;
        this.bandsForMeterNum = meterNum;
        //Report the window actually in use, after Nyquist clamping.
        this.bandFMin = fMin;
        this.bandFMax = fMax;
        return bands;
    },
    //Switch between the logarithmic and linear frequency scale.
    setScale: function(scale) {
        this.freqScale = scale === 'linear' ? 'linear' : 'log';
        //Force the mapping to be rebuilt on the next frame.
        this.bands = null;
        this.bandsForMeterNum = 0;
        this.capYPositionArray = [];
        return this.freqScale;
    },
    _addEventListner: function() {
        var that = this,
            audioInput = document.getElementById('uploadedFile'),
            dropContainer = document.getElementsByTagName("canvas")[0];
        //Frequency scale switch: log (default) or linear.
        var scaleButtons = document.querySelectorAll('[data-scale]');
        for (var s = 0; s < scaleButtons.length; s++) {
            scaleButtons[s].addEventListener('click', function() {
                var scale = this.getAttribute('data-scale');
                that.setScale(scale);
                for (var k = 0; k < scaleButtons.length; k++) {
                    var isActive = scaleButtons[k].getAttribute('data-scale') === that.freqScale;
                    scaleButtons[k].setAttribute('aria-pressed', isActive ? 'true' : 'false');
                }
            }, false);
        }
        //listen the file upload
        audioInput.onchange = function() {
            if (that.audioContext===null) {return;};

            //the if statement fixes the file selction cancle, because the onchange will trigger even the file selection been canceled
            if (audioInput.files.length !== 0) {
                //only process the first file
                that.file = audioInput.files[0];
                that.fileName = that.file.name;
                if (that.status === 1) {
                    //the sound is still playing but we upload another file, so set the forceStop flag to true
                    that.forceStop = true;
                };
                document.getElementById('fileWrapper').style.opacity = 1;
                that._updateInfo('Uploading', true);
                //once the file is ready,start the visualizer
                that._start();
            };
        };
        //listen the drag & drop
        dropContainer.addEventListener("dragenter", function() {
            document.getElementById('fileWrapper').style.opacity = 1;
            that._updateInfo('Drop it on the page', true);
        }, false);
        dropContainer.addEventListener("dragover", function(e) {
            e.stopPropagation();
            e.preventDefault();
            //set the drop mode
            e.dataTransfer.dropEffect = 'copy';
        }, false);
        dropContainer.addEventListener("dragleave", function() {
            document.getElementById('fileWrapper').style.opacity = 0.2;
            that._updateInfo(that.info, false);
        }, false);
        dropContainer.addEventListener("drop", function(e) {
            e.stopPropagation();
            e.preventDefault();
            if (that.audioContext===null) {return;};
            document.getElementById('fileWrapper').style.opacity = 1;
            that._updateInfo('Uploading', true);
            //get the dropped file
            that.file = e.dataTransfer.files[0];
            if (that.status === 1) {
                document.getElementById('fileWrapper').style.opacity = 1;
                that.forceStop = true;
            };
            that.fileName = that.file.name;
            //once the file is ready,start the visualizer
            that._start();
        }, false);
    },
    _start: function() {
        //read and decode the file into audio array buffer
        var that = this,
            file = this.file,
            fr = new FileReader();
        fr.onload = function(e) {
            var fileResult = e.target.result;
            var audioContext = that.audioContext;
            if (audioContext === null) {
                return;
            };
            that._updateInfo('Decoding the audio', true);
            audioContext.decodeAudioData(fileResult, function(buffer) {
                that._updateInfo('Decode succussfully,start the visualizer', true);
                that._visualize(audioContext, buffer);
            }, function(e) {
                that._updateInfo('!Fail to decode the file', false);
                console.log(e);
            });
        };
        fr.onerror = function(e) {
            that._updateInfo('!Fail to read the file', false);
            console.log(e);
        };
        //assign the file to the reader
        this._updateInfo('Starting read the file', true);
        fr.readAsArrayBuffer(file);
    },
    _visualize: function(audioContext, buffer) {
        var audioBufferSouceNode = audioContext.createBufferSource(),
            analyser = audioContext.createAnalyser(),
            that = this;
        //connect the source to the analyser
        audioBufferSouceNode.connect(analyser);
        //connect the analyser to the destination(the speaker), or we won't hear the sound
        analyser.connect(audioContext.destination);
        //then assign the buffer to the buffer source node
        audioBufferSouceNode.buffer = buffer;
        //play the source
        if (!audioBufferSouceNode.start) {
            audioBufferSouceNode.start = audioBufferSouceNode.noteOn //in old browsers use noteOn method
            audioBufferSouceNode.stop = audioBufferSouceNode.noteOff //in old browsers use noteOn method
        };
        //stop the previous sound if any
        if (this.animationId !== null) {
            cancelAnimationFrame(this.animationId);
        }
        if (this.source !== null) {
            this.source.stop(0);
        }
        audioBufferSouceNode.start(0);
        this.status = 1;
        this.source = audioBufferSouceNode;
        audioBufferSouceNode.onended = function() {
            that._audioEnd(that);
        };
        this._updateInfo('Playing ' + this.fileName, false);
        this.info = 'Playing ' + this.fileName;
        document.getElementById('fileWrapper').style.opacity = 0.2;
        this._drawSpectrum(analyser);
    },
    //Paint the peak-hold caps and bars. The spectrum is drawn with a bottom-to-top
    //green/yellow/red gradient, cached until the canvas height changes.
    _ensureGradient: function(ctx, height) {
        if (this._gradient && this._gradientHeight === height) {
            return this._gradient;
        }
        var gradient = ctx.createLinearGradient(0, height, 0, 0);
        gradient.addColorStop(0, '#0f0');
        gradient.addColorStop(0.5, '#ff0');
        gradient.addColorStop(1, '#f00');
        this._gradient = gradient;
        this._gradientHeight = height;
        return gradient;
    },
    _drawSpectrum: function(analyser) {
        var that = this,
            canvas = document.getElementById('canvas'),
            ctx = canvas.getContext('2d'),
            capHeight = this.capHeight,
            capStyle = '#fff',
            capYPositionArray = this.capYPositionArray;

        var drawMeter = function() {
            var array = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(array);
            if (that.status === 0) {
                //fix when some sounds end the value still not back to zero
                var i;
                for (i = array.length - 1; i >= 0; i--) {
                    array[i] = 0;
                };
                var allCapsReachBottom = true;
                for (i = capYPositionArray.length - 1; i >= 0; i--) {
                    allCapsReachBottom = allCapsReachBottom && (capYPositionArray[i] === 0);
                };
                if (allCapsReachBottom) {
                    //Trim in case a resize grew the array, so the next track
                    //starts from a matching length.
                    capYPositionArray.length = Math.min(capYPositionArray.length, that.meterNum);
                    cancelAnimationFrame(that.animationId); //since the sound is top and animation finished, stop the requestAnimation to prevent potential memory leak,THIS IS VERY IMPORTANT!
                    return;
                };
            };
            //Read the layout and canvas size fresh each frame, because a
            //re-measure can land while the animation is running.
            var meterWidth = that.meterWidth;
            var gap = that.gap;
            var meterNum = that.meterNum;
            var cwidth = canvas.width;
            var cheight = canvas.height - 2;
            var bands = that.bands;
            if (!bands || that.bandsForMeterNum !== meterNum) {
                bands = that._buildBands(analyser, meterNum);
            }
            if (capYPositionArray.length < meterNum) {
                for (var c = capYPositionArray.length; c < meterNum; c++) {
                    capYPositionArray.push(0);
                }
            }
            var drawWidth = meterWidth + gap;
            var gradient = that._ensureGradient(ctx, cheight);
            ctx.clearRect(0, 0, cwidth, cheight);
            for (var i = 0; i < meterNum; i++) {
                //Take the strongest bin in this band rather than a single
                //sampled bin, so narrow peaks are not missed between samples.
                var band = bands[i];
                var value = 0;
                for (var b = band.lo; b < band.hi; b++) {
                    if (array[b] > value) value = array[b];
                }
                var x = i * drawWidth;
                ctx.fillStyle = capStyle;
                //draw the cap, with transition effect
                if (value < capYPositionArray[i]) {
                    ctx.fillRect(x, cheight - (--capYPositionArray[i]), meterWidth, capHeight);
                } else {
                    ctx.fillRect(x, cheight - value, meterWidth, capHeight);
                    capYPositionArray[i] = value;
                };
                ctx.fillStyle = gradient; //set the fillStyle to gradient for a better look
                ctx.fillRect(x /*meterWidth+gap*/ , cheight - value + capHeight, meterWidth, cheight); //the meter
            }
            that.animationId = requestAnimationFrame(drawMeter);
        }
        this.animationId = requestAnimationFrame(drawMeter);
    },
    _audioEnd: function(instance) {
        if (this.forceStop) {
            this.forceStop = false;
            this.status = 1;
            return;
        };
        this.status = 0;
        var text = 'HTML5 Audio API showcase | An Audio Visualizer';
        document.getElementById('fileWrapper').style.opacity = 1;
        document.getElementById('info').innerHTML = text;
        instance.info = text;
        document.getElementById('uploadedFile').value = '';
    },
    _updateInfo: function(text, processing) {
        var infoBar = document.getElementById('info'),
            dots = '...',
            i = 0,
            that = this;
        infoBar.innerHTML = text + dots.substring(0, i++);
        if (this.infoUpdateId !== null) {
            clearTimeout(this.infoUpdateId);
        };
        if (processing) {
            //animate dots at the end of the info text
            var animateDot = function() {
                if (i > 3) {
                    i = 0
                };
                infoBar.innerHTML = text + dots.substring(0, i++);
                that.infoUpdateId = setTimeout(animateDot, 250);
            }
            this.infoUpdateId = setTimeout(animateDot, 250);
        };
    }
}
</script>
</body>
</html>
